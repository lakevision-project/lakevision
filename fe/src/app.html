<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set the Carbon theme before first paint. Doing this from onMount instead
			// renders one light frame before hydration, which reads as a flash on a
			// dark-themed desktop.
			(function () {
				try {
					var stored = localStorage.getItem('lakevision.theme');
					var mode =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('theme', mode === 'dark' ? 'g100' : 'white');
					document.documentElement.style.colorScheme = mode;
				} catch (e) {
					document.documentElement.setAttribute('theme', 'white');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
