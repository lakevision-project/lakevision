name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-style:
    name: Check code style and install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: ./be
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        working-directory: ./be
        env:
          PYTHONPATH: app
        run: |
          . .venv/bin/activate
          pytest tests

      - name: Install frontend dependencies
        working-directory: ./fe
        run: npm ci

      # Not yet blocking: 21 files have pre-existing Prettier formatting drift.
      # Reformatting them is a large diff unrelated to any current change, so it
      # is deliberately deferred rather than hidden -- the step reports the
      # result and continues. Remove continue-on-error once `npm run format`
      # has been run across the tree.
      - name: Lint frontend (non-blocking)
        working-directory: ./fe
        continue-on-error: true
        run: npm run lint

      - name: Check frontend builds
        working-directory: ./fe
        run: npm run build

      - name: Print Makefile help
        run: make help
